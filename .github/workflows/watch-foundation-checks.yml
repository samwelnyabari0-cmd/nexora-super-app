name: Watch foundation checks

on:
  pull_request:
    branches: [main]
    paths:
      - "src/features/watch/**"
      - "src/routes/watch.tsx"
      - "src/components/nexora/**"
      - "src/integrations/supabase/**"
      - "supabase/migrations/**"
      - ".github/workflows/watch-foundation-checks.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: watch-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Lint Watch feature
        run: >-
          npx eslint
          src/features/watch/logic.ts
          src/features/watch/logic.test.ts
          src/features/watch/data.ts
          src/features/watch/WatchPlayer.tsx
          src/routes/watch.tsx
          --rule "prettier/prettier: off"
      - name: Build production bundle
        run: npm run build
      - name: TypeScript baseline audit
        run: npx tsc --noEmit
        continue-on-error: true
