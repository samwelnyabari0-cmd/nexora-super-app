name: Media framing and feed checks

on:
  push:
    branches:
      - feature/media-framing-editorial-feed
      - feature/media-framing-editorial-final
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check formatting of new media modules
        run: npx prettier --check src/lib/media-framing.ts src/lib/media-framing.test.ts src/lib/media-poster.ts src/lib/media-poster.test.ts src/components/nexora/MediaFramingEditor.tsx 
      - name: Run focused media tests
        run: npm test -- src/lib/media-framing.test.ts src/lib/media-poster.test.ts src/components/nexora/WorldNewsPanel.test.tsx
      - name: Lint new media modules
        run: npx eslint src/lib/media-framing.ts src/lib/media-framing.test.ts src/lib/media-poster.ts src/lib/media-poster.test.ts src/components/nexora/MediaFramingEditor.tsx src/components/nexora/WorldNewsPanel.tsx src/components/nexora/WorldNewsPanel.test.tsx
      - name: Build application
        run: npm run build
