name: World Daily News checks

on:
  pull_request:
    paths:
      - "src/components/nexora/WorldNewsPanel.tsx"
      - "src/components/nexora/WorldNewsPanel.test.tsx"
      - "src/routes/index.tsx"
      - "src/routes/explore.tsx"
      - "src/routes/videos.tsx"
      - "src/features/football/useMatchCenter.ts"
      - "supabase/functions/football-content-sync/**"
      - "docs/world-daily-news.md"
      - ".github/workflows/world-daily-news-checks.yml"
  push:
    branches: [main]
    paths:
      - "src/components/nexora/WorldNewsPanel.tsx"
      - "src/components/nexora/WorldNewsPanel.test.tsx"
      - "src/routes/index.tsx"
      - "src/routes/explore.tsx"
      - "src/routes/videos.tsx"
      - "src/features/football/useMatchCenter.ts"
      - "supabase/functions/football-content-sync/**"

permissions:
  contents: read

concurrency:
  group: world-daily-news-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Run World Daily News tests
        run: bun run test -- src/components/nexora/WorldNewsPanel.test.tsx
      - name: Lint World Daily News component and tests
        run: bunx eslint src/components/nexora/WorldNewsPanel.tsx src/components/nexora/WorldNewsPanel.test.tsx
      - name: Build production app
        run: bun run build
      - name: Set up Deno
        uses: denoland/setup-deno@v2
      - name: Type-check RSS Edge Function
        run: deno check supabase/functions/football-content-sync/index.ts
