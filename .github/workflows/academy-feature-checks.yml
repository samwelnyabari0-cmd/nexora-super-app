name: Academy feature checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/academy-educator-discovery
      - feat/academy-creator-content-management

permissions:
  contents: read

concurrency:
  group: academy-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Academy tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        # The current package-lock.json is out of sync with package.json.
        # npm install reconciles it in this temporary CI checkout.
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: TypeScript baseline audit (non-blocking)
        run: npx tsc --noEmit
        continue-on-error: true
