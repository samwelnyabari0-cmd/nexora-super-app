<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101018">
  <title>NEXORA — You're offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101018;color:#f8fafc;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}.card{width:min(100%,440px);padding:32px;border:1px solid #343445;border-radius:24px;background:#191923;text-align:center}.mark{width:64px;height:64px;margin:0 auto 18px;display:block;object-fit:contain;border-radius:16px}.muted{color:#a1a1b5;line-height:1.6}button{margin-top:20px;border:0;border-radius:999px;background:#8b5cf6;color:white;padding:12px 20px;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <img class="mark" src="/nexora-icon.svg" alt="" aria-hidden="true">
    <h1>You're offline</h1>
    <p class="muted">Reconnect to load your NEXORA feed, chats and profiles. Media you saved in your Daily Commute Pack stays on this device.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
